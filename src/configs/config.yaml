# Main Hydra config: composes model, data, train, and experiment bundle.
# From repo root:  python src/train.py  (or python src/train)
defaults:
  - model: tsm_resnet
  - data: default
  - train: default
  - augmentation: default
  - wandb: "off"
  - experiment: track_a_best
  - _self_

# Optional: where Hydra stores run outputs (checkpoints printed in src/train)
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

num_classes: 33