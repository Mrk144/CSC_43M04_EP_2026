# @package _global_
# Track A best so far: TSM-ResNet18 from scratch, CE + label smoothing,
# AdamW with linear warmup -> cosine schedule.
defaults:
  - override /model: tsm_resnet

training:
  batch_size: 64
  lr: 3e-4
  epochs: 40
  warmup_epochs: 3
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
