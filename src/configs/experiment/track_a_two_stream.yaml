# @package _global_
# Track A: two-stream TSM (RGB + frame-difference) from scratch.
# Each stream internally upsamples 4 raw frames -> 7 (one interpolated frame
# between each pair of original frames).
defaults:
  - override /model: tsm_two_stream

model:
  num_frames: 7

training:
  batch_size: 32
  lr: 3e-4
  epochs: 40
  warmup_epochs: 3
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
