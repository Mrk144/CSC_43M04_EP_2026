# @package _global_
# Track B phase 1: linear probing on V-JEPA2 (head only).
# The encoder is frozen; only the new linear classifier is trained.
defaults:
  - override /model: vjepa2

model:
  freeze_backbone: true
  num_frames: 16

training:
  batch_size: 8
  lr: 1e-3
  epochs: 5
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
