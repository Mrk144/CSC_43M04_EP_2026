# @package _global_
defaults:
  - override /model: vjepa2

model:
  variant: facebook/vjepa2-vitl-fpc16-256-ssv2
  freeze_backbone: false
  num_frames: 16
  ignore_mismatched_sizes: true

training:
  batch_size: 4
  lr: 1e-5

  epochs: 30
  warmup_epochs: 1
  num_workers: 12

  resume_model_only: true

  optimizer:
    name: adamw
    weight_decay: 0.05
