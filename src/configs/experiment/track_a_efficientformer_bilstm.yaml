# @package _global_
# Track A: EfficientFormer V2 + BiLSTM + attention (requires timm).
defaults:
  - override /model: efficientformer_bilstm

model:
  num_frames: 7

training:
  batch_size: 48
  lr: 3e-4
  epochs: 50
  warmup_epochs: 3
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05
