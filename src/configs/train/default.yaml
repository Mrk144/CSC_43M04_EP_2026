# @package _global_
# Shared training defaults (Track A recipe). Experiments override batch_size, lr, etc.
training:
  batch_size: 8
  lr: 3.0e-4
  epochs: 30
  warmup_epochs: 3
  num_workers: 12
  checkpoint_path: "best_model.pt"
  device: cuda
  resume_from: null
  resume_model_only: false

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: focal_loss
    label_smoothing: 0.1
    gamma: 2.0
    class_weights: auto
    class_weights_mode: effective_num
    class_weights_beta: 0.9999
