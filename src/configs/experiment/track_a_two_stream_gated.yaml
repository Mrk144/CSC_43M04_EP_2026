# @package _global_
# Track A: two-stream TSM with learned fusion gate.
defaults:
  - override /model: tsm_two_stream_gated

model:
  num_frames: 7

training:
  batch_size: 32
  lr: 3e-4
  epochs: 40
  warmup_epochs: 3
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
