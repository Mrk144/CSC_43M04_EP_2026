# @package _global_
# Track B phase 1: linear probing on PyTorchVideo X3D-M (Kinetics-pretrained).
defaults:
  - override /model: x3d

model:
  freeze_backbone: true
  variant: x3d_m
  num_frames: 16
  input_size: 224

training:
  batch_size: 16
  lr: 1e-3
  epochs: 5
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
