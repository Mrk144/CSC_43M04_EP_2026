# @package _global_
defaults:
  - override /model: tsm_resnet  # On change le modèle ici

training:
  batch_size: 64
  lr: 0.0001
  epochs: 15
  num_workers: 12
  
  optimizer:
    name: adamw          # On définit l'optimiseur ici
    lr: ${training.lr}   # Interpolation dynamique
    weight_decay: 0.005
  
  loss:
    name: "focal_loss"     # On définit la perte ici
    label_smoothing: 0.1
    gamma: 2.0