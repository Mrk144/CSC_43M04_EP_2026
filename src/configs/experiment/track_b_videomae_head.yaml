# @package _global_
# Track B phase 1: linear probing (head only) on VideoMAE SSv2-pretrained backbone.
# Dataset serves the raw 4 frames; the VideoMAE wrapper interpolates to 16
# internally (matching its positional embeddings).
defaults:
  - override /model: videomae

model:
  freeze_backbone: true
  num_frames: 16

training:
  batch_size: 8
  lr: 1e-3
  epochs: 5
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05
