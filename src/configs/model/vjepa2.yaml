# @package _global_
# V-JEPA2 (Meta) video classifier via HuggingFace.
# Variants:
#   facebook/vjepa2-vitl-fpc16-256-ssv2 (default, SSv2 fine-tuned — recommended)
#   facebook/vjepa2-vitl-fpc16-256 (encoder-only, legacy linear head)
#   facebook/vjepa2-vitg-fpc16-256 (heavier ViT-g)
#   facebook/vjepa2-vitl-fpc64-256 (more temporal context, slower)
model:
  name: vjepa2
  variant: facebook/vjepa2-vitl-fpc16-256-ssv2
  pretrained: true
  num_classes: ${num_classes}
  freeze_backbone: false
  num_frames: 16
  input_size: 256
  dropout: 0.1
  ignore_mismatched_sizes: true
