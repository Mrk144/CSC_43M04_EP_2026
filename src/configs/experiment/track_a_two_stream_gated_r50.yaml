# @package _global_
# Track A: two-stream TSM gated fusion, ResNet50 per stream (VRAM-heavy).
defaults:
  - override /model: tsm_two_stream_gated_r50

model:
  num_frames: 7

training:
  batch_size: 12
  lr: 3e-4
  epochs: 40
  warmup_epochs: 3
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05
