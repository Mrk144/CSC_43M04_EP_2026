# @package _global_
defaults:
  - override /model: tsm_resnet  # On change le modèle ici

training:
  batch_size: 64         # On augmente pour la stabilité
  lr: 0.0005             # LR plus fin
  epochs: 20             # Équilibre anti-overfit
  num_workers: 16
  
  optimizer:
    name: adamw          # On définit l'optimiseur ici
    lr: ${training.lr}   # Interpolation dynamique
    weight_decay: 0.001
  
  loss:
    name: "cross_entropy"     # On définit la perte ici
    label_smoothing: 0.1