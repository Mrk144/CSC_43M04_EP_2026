# @package _global_
# Shared training defaults (Track A recipe). Experiments override batch_size, lr, etc.
training:
  batch_size: 8
  lr: 1.0e-3
  epochs: 40
  warmup_epochs: 3
  num_workers: 12
  checkpoint_path: "best_model.pt"
  device: cuda
  resume_from: null
  resume_model_only: false

  optimizer:
    name: adamw
    weight_decay: 0.05

  scheduler:
    name: cosine
    eta_min: 1.0e-6
    eta_min_ratio: null
    t_max_ratio: 1.0

  loss:
    name: focal_loss
    label_smoothing: 0.1
    gamma: 2.0
    class_weights: auto
    class_weights_mode: effective_num
    class_weights_beta: 0.9999
