# @package _global_
# Track B phase 1: linear probing on VideoMAE-Large finetuned on Kinetics.
# Larger backbone than the SSv2 base variant; potentially stronger features but
# 3-4x slower and more VRAM-hungry.
defaults:
  - override /model: videomae

model:
  variant: MCG-NJU/videomae-large-finetuned-kinetics
  freeze_backbone: true
  num_frames: 16

training:
  batch_size: 4
  lr: 1e-3
  epochs: 5
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
