# @package _global_
# MoE : mean | val_acc (val_acc nécessite des labels → val seulement)
#
# Éval val :
#   python src/evaluate.py +moe=default
#   python src/evaluate.py +moe=default moe.combination=mean
#
# Soumission test :
#   python src/create_submission.py +moe=default moe.combination=mean
#   python src/create_submission.py +moe=default moe.combination=val_acc

dataset:
  val_dir: ${hydra:runtime.cwd}/processed_data/val2/val
  test_dir: ${hydra:runtime.cwd}/processed_data/val2/test
  submission_output: ${hydra:runtime.cwd}/processed_data/val2/submission_moe.csv

moe:
  output_csv: ${hydra:runtime.cwd}/processed_data/val2/submission_moe.csv
  experts:
    - name: cnn_lstm
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_02-06-19/best_model.pt
    - name: cnn_transformer
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_03-54-59/best_model.pt
    - name: tsm_resnet
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_12-44-38/best_model.pt
    - name: tsm_two_stream
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_14-41-02/best_model.pt

  combination: val_acc
  calibrate_temperature: true
