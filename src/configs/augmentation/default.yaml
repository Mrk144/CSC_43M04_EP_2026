# @package _global_
# Data augmentation (train) + optional TTA (eval / submission).
#
# Horizontal flip swaps labels 18 <-> 19:
#   018_Pulling_something_from_left_to_right
#   019_Pulling_something_from_right_to_left

augmentation:
  enabled: true

  random_resized_crop:
    enabled: true
    scale: [0.7, 1.0]

  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05

  random_erasing:
    enabled: true
    prob: 0.25

  hflip:
    enabled: true
    prob: 0.5

  mixup:
    enabled: true
    alpha: 0.2
    prob: 0.35

  cutmix:
    enabled: true
    alpha: 1.0
    prob: 0.35

  tta:
    enabled: false
    hflip: true
    swap_directional_logits: true
