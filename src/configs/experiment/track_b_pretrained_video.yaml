# @package _global_
# Track B (open world): fine-tune a Kinetics-pretrained video backbone.
# Lower LR than from-scratch because the backbone is already well-trained.
defaults:
  - override /model: pretrained_video

training:
  batch_size: 16
  lr: 1e-4
  epochs: 20
  warmup_epochs: 2
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
