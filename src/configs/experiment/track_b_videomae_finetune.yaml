# @package _global_
# Track B phase 2: full backbone finetune with a small lr, resuming the model
# weights trained in phase 1 (head only). Pass the phase-1 checkpoint via:
#   training.resume_from=/abs/path/to/phase1/best_model.pt
# The dataset serves the raw 4 frames; VideoMAE upsamples to 16 internally.
defaults:
  - override /model: videomae

model:
  freeze_backbone: false
  num_frames: 16

training:
  batch_size: 8
  lr: 1e-5
  epochs: 10
  warmup_epochs: 1
  num_workers: 12

  resume_model_only: true

  optimizer:
    name: adamw
    weight_decay: 0.05
