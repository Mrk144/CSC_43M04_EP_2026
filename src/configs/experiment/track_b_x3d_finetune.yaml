# @package _global_
# Track B phase 2: full X3D-M finetune, resuming phase-1 head-only weights.
# Pass --training.resume_from=<phase1.pt>.
defaults:
  - override /model: x3d

model:
  freeze_backbone: false
  variant: x3d_m
  num_frames: 16
  input_size: 224

training:
  batch_size: 8
  lr: 5e-5
  epochs: 15
  warmup_epochs: 2
  num_workers: 12

  resume_model_only: true

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
