# @package _global_
# Track B phase 1: linear probing on V-JEPA2 SSv2 fine-tuned (head only).
# The encoder is frozen; only the new linear classifier is trained.
defaults:
  - override /model: vjepa2

model:
  variant: facebook/vjepa2-vitl-fpc16-256-ssv2
  freeze_backbone: true
  num_frames: 16
  ignore_mismatched_sizes: true

training:
  batch_size: 8
  lr: 1e-3

  epochs: 30
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05
