[project]
name = "challenge"
version = "0.1.0"
description = "Video frame classification (PyTorch + Hydra). Training code lives in project/."
readme = false
requires-python = ">=3.10"
dependencies = [
    # Versions aligned with wheels on the PyTorch cu128 index (Linux/Windows).
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    # HuggingFace foundation models (VideoMAE, V-JEPA2, InternVideo, ...).
    # V-JEPA2 classes were added in transformers 4.52.
    "transformers>=4.52",
    # InternVideo2 + some custom HF repos rely on these for tokenization / utils.
    "einops>=0.7",
    # PyTorchVideo (X3D, SlowFast). Last release is 0.1.5 (2022) but it still
    # imports under PyTorch 2.x as long as `iopath`/`fvcore` are present.
    "pytorchvideo>=0.1.5",
    "fvcore>=0.1.5",
    "iopath>=0.1.10",
]

[tool.uv]
package = false

# CUDA 12.8 builds: https://download.pytorch.org/whl/cu128
# explicit = true keeps non-PyTorch deps on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Use cu128 wheels on Linux and Windows. PyTorch does not ship CUDA wheels for macOS;
# those platforms fall back to PyPI (CPU) automatically.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
