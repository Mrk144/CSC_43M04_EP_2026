# @package _global_
# Track B phase 2: full V-JEPA2 finetune with a small lr, resuming the head-only
# checkpoint from phase 1.  Pass --training.resume_from=<phase1.pt>.
defaults:
  - override /model: vjepa2

model:
  variant: facebook/vjepa2-vitl-fpc16-256-ssv2
  freeze_backbone: false
  num_frames: 16
  ignore_mismatched_sizes: true

training:
  batch_size: 4
  lr: 1e-5
  epochs: 10
  warmup_epochs: 1
  num_workers: 12

  resume_model_only: true

  optimizer:
    name: adamw
    weight_decay: 0.05

  loss:
    name: cross_entropy
    label_smoothing: 0.1
