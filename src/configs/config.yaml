# Main Hydra config: composes model, data, train, and experiment bundle.
# Run from `src/`:  python train.py experiment=track_a_best
defaults:
  - model: tsm_resnet
  - data: default
  - train: default
  - augmentation: default
  - wandb: off
  - experiment: track_a_best
  - _self_

# Optional: where Hydra stores run outputs (checkpoints printed in train.py)
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

num_classes: 33