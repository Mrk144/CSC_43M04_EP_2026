# @package _global_
# Track B phase 1: linear probing on InternVideo2 stage-2 (head only).
defaults:
  - override /model: internvideo2

model:
  freeze_backbone: true
  num_frames: 8

training:
  batch_size: 8
  lr: 1e-3
  epochs: 5
  warmup_epochs: 1
  num_workers: 12

  optimizer:
    name: adamw
    weight_decay: 0.05
