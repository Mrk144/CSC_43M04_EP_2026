# @package _global_
# 4 modèles → UN seul CSV d'ensemble (vote majoritaire).
#
# Depuis la racine :
#   python src/create_submission.py +submission=multi_four_models
#
# Fichier produit : processed_data/val2/submission.csv

dataset:
  test_dir: ${hydra:runtime.cwd}/processed_data/val2/test
  submission_output: ${hydra:runtime.cwd}/processed_data/val2/submission.csv

submission:
  models:
    - name: cnn_lstm
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_02-06-19/best_model.pt
    - name: cnn_transformer
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_03-54-59/best_model.pt
    - name: tsm_resnet
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_12-44-38/best_model.pt
    - name: tsm_two_stream
      checkpoint: ${hydra:runtime.cwd}/outputs/2026-05-16_14-41-02/best_model.pt

  output_csv: ${hydra:runtime.cwd}/processed_data/val2/submission.csv
  output_format: simple
  ensemble_column: majority
  write_per_model: false
