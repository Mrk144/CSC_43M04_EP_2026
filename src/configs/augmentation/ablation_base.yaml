# @package _global_
# Minimal train transforms for augmentation ablation: Resize + CenterCrop only.
# All YAML-controlled augs off (RandomGrayscale p=0.1 remains hardcoded in utils.py).
augmentation:
  enabled: true
  random_resized_crop:
    enabled: false
  color_jitter:
    enabled: false
  random_erasing:
    enabled: false
  hflip:
    enabled: false
  mixup:
    enabled: false
  cutmix:
    enabled: false
  tta:
    enabled: false
