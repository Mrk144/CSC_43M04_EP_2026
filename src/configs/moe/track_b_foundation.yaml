# @package _global_
defaults:
  - override /model: videomae

dataset:
  val_dir: ${hydra:runtime.cwd}/processed_data/val2/val
  test_dir: ${hydra:runtime.cwd}/processed_data/val2/test
  submission_output: ${hydra:runtime.cwd}/processed_data/val2/submission_moe_track_b.csv

training:
  batch_size: 8
  num_workers: 4
  device: cuda

moe:
  output_csv: ${dataset.submission_output}
  combination: mean
  calibrate_temperature: true
  experts:
    - name: videomae
      checkpoint: ${hydra:runtime.cwd}/outputs/videomae_finetune/best_model.pt
      batch_size: 8
    - name: vjepa2
      checkpoint: ${hydra:runtime.cwd}/outputs/vjepa2_finetune/best_model.pt
      batch_size: 4
