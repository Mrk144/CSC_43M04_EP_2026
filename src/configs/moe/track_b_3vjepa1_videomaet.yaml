# @package _global_
# MoE: 3x V-JEPA2 (SSv2 s3/s4/s5) + 1x VideoMAE (SSv2 fine-tune)
#
# Éval (si tu veux) :
#   python src/evaluate.py +moe=track_b_3vjepa1_videomae moe.combination=val_acc
#
# Soumission :
#   python src/create_submission.py +moe=track_b_3vjepa1_videomae moe.combination=val_acc

defaults:
  - override /model: videomae

dataset:
  val_dir: ${hydra:runtime.cwd}/processed_data/val2/val
  test_dir: ${hydra:runtime.cwd}/processed_data/val2/test
  submission_output: ${hydra:runtime.cwd}/processed_data/val2/submission_moe_3vjepa_videomae.csv

moe:
  output_csv: ${dataset.submission_output}
  # val_acc: ajuste les poids sur les logits de la val (labels requis), puis applique sur le test.
  combination: val_acc
  calibrate_temperature: true

  experts:
    - name: vjepa2_best
      checkpoint: ${hydra:runtime.cwd}/outputs/vjepa2_best/best_model.pt
      batch_size: 4
    - name: vjepa2_s3
      checkpoint: ${hydra:runtime.cwd}/outputs/vjepa2_ssv2_s3/best_model.pt
      batch_size: 4
    - name: vjepa2_s4
      checkpoint: ${hydra:runtime.cwd}/outputs/vjepa2_ssv2_s4/best_model.pt
      batch_size: 4
    - name: vjepa2_s5
      checkpoint: ${hydra:runtime.cwd}/outputs/vjepa2_ssv2_s5/best_model.pt
      batch_size: 4
    - name: videomae_ssv2_finetune
      checkpoint: ${hydra:runtime.cwd}/outputs/videomae_ssv2_finetune/best_model.pt
      batch_size: 8